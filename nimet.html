<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shape Rush – Hoş Geldiniz</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101526;color:white;font-family:system-ui;text-align:center;overflow:hidden}main{position:relative;z-index:2;padding:28px;width:min(95%,420px)}h1,h2{color:#fbbf24}h1{letter-spacing:4px}a{display:block;background:#2563eb;color:white;text-decoration:none;padding:18px;border-radius:16px;font-weight:bold;margin:30px 0}p{color:#cbd5e1}.confetti{position:fixed;top:-20px;width:7px;height:12px;animation:fall linear infinite;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(prefers-reduced-motion:reduce){.confetti{display:none}}</style><main><div style="font-size:48px;color:#38bdf8">● <span style="color:#a78bfa">◆</span> <span style="color:#fbbf24">▲</span></div><h1>SHAPE RUSH</h1><h2>Nimet Tekin Hanım,<br>Hoş Geldiniz!</h2><p>Size özel bir karşılama.</p><a href="https://9tnkmh2nph-dev.github.io/shape-rush/">OYUNA BAŞLA</a><p>Keyifli oyunlar! 🌹</p></main><script>for(let i=0;i<65;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#fbbf24','#f472b6','#38bdf8','#a78bfa'][i%4];e.style.animationDuration=3+Math.random()*4+'s';e.style.animationDelay=-Math.random()*7+'s';document.body.append(e)}</script></html>
