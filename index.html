*{box-sizing:border-box}body{margin:0;background:#0b1021;color:#e5ecff;font:16px system-ui;overscroll-behavior:none}main{max-width:480px;margin:auto;padding:14px;min-height:100dvh;background:linear-gradient(150deg,#1c2240,#101628)}header,.stats,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}header b{color:#72eaff;letter-spacing:3px;text-shadow:0 0 16px #35c9ff}button,select{font:inherit;color:inherit;background:#25334f;border:1px solid #495779;border-radius:12px;padding:12px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}button.primary{background:linear-gradient(110deg,#58e4f3,#a58bff);color:#10162b;font-weight:800}button.full{width:100%;margin:6px 0}small{color:#aab7d6}.stats{margin:12px 0;font-size:13px}.gold{color:#ffd477}#stage{position:relative;height:clamp(300px,52dvh,520px);overflow:hidden;border-radius:16px;background:#10172b}canvas{width:100%;height:100%;display:block;touch-action:none}#overlay{position:absolute;inset:0;background:#11182ce8;display:flex;flex-direction:column;justify-content:center;padding:18px;text-align:center;overflow:auto}#overlay[hidden], [hidden]{display:none!important}h1{letter-spacing:4px;font-size:30px;margin:10px 0;color:#e5faff}h2{margin:8px 0}p{margin:8px 0}.symbols{font-size:35px;letter-spacing:7px}.row button{flex:1;font-size:13px}#controls,#powers{margin-top:8px}#controls button{font-size:23px;padding:9px}#notice{min-height:22px;text-align:center;color:#ffda86;font-size:13px}dialog{width:min(92vw,440px);max-height:85dvh;overflow:auto;background:#19243b;color:#edf3ff;border:1px solid #536488;border-radius:16px;padding:18px}dialog::backdrop{background:#000a}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #39445d;padding:10px 0}.item button{font-size:13px}label{display:block;margin:12px 0}select{max-width:100%}</style><main><header><b>SHAPE RUSH</b><span class="gold">◉ <span id="coins">0</span></span><button id="settings">⚙</butto 'use strict';const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');let store=true;const defaults={coins:0,records:[0,0,0],owned:[0],skin:0,lang:'tr',sound:true,control:'both',games:0,total:0,maxCombo:0,maxLevel:1,day:'',daily:{date:'',matches:0,games:0,combo:0,claimed:[]}};let s=structuredClone(defaults);try{Object.assign(s,JSON.parse(localStorage.getItem('shapeRushRebuilt61')||'{}'))}catch(e){store=false}const day=()=>new Date().toLocaleDateString('en-CA');function daily(){if(s.daily.date!==day())s.daily={date:day(),matches:0,games:0,combo:0,claimed:[]}}daily();function save(){try{localStorage.setItem('shapeRushRebuilt61',JSON.stringify(s))}catch(e){store=false}}const tr=(a,b)=>s.lang==='tr'?a:b;const palettes=[['#54e5ff','#ffd16b','#ff5aa5','#65ffb8'],['#ffac66','#ffdf8a','#ff665e','#f4a4ff'],['#85aaff','#c5d9ff','#aa8cff','#67f0ff'],['#ff6ff1','#fff27b','#7dff72','#6d9dff'],['#f0f0ff','#9aa9c4','#e3c1ff','#b7f7e9']];const names=['Neon','Solar','Ice','Arcade','Crystal'];let mode=0,state='menu',score=0,combo=0,level=1,lives=3,time=60,lane=1,kind=0,y=0,slow=0,shield=false,particles=[],last=performance.now(),audio;function sound(ok){if(!s.sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=ok?650:160;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}function notify(t){$('notice').textContent=t}function spawn(){kind=Math.floor(Math.random()*4);lane=Math.floor(Math.random()*4);y=0}function hud(){$('coins').textContent=s.coins;$('life').textContent=mode===1?Math.ceil(time)+' s':'♥'.repeat(Math.max(0,lives));$('combo').textContent=tr('KOMBO','COMBO')+' ×'+combo;$('score').textContent=tr('PUAN ','SCORE ')+score;$('best').textContent=tr('REKOR ','BEST ')+s.records[mode];$('level').textContent=tr('SEVİYE ','LEVEL ')+level;$('shop').textContent=tr('Mağaza','Shop');$('missions').textContent=tr('Görevler','Missions');$('badges').textContent=tr('Rozetler','Badges');$('controls').hidden=s.control==='touch'||state!=='play';$('powers').hidden=state!=='play';$('powers').innerHTML='';[[tr('Yavaşlat','Slow'),20],[tr('Kalkan','Shield'),30],[tr('Eşleştir','Match'),15]].forEach(([n,c],i)=>{let b=document.createElement('button');b.textContent=n+' · '+c;b.disabled=s.coins<c;b.onclick=()=>power(i,c);$('powers').append(b)})}function overlay(html){$('overlay').hidden=false;$('overlay').innerHTML=html}function menu(){state='menu';hud();overlay(`<div class="symbols"><span style="color:#54e5ff">■</span><span style="color:#ffd16b">●</span><span style="color:#ff5aa5">▲</span><span style="color:#65ffb8">◆</span></div><h1>SHAPE RUSH</h1><small style="letter-spacing:5px;color:#b9a1ff">FINAL EDITION</small><p>${tr('Eşleştir. Güçlen. Rekor kır.','Match. Power up. Break records.')}</p><button class="full primary" data-mode="0">▶ ${tr('KLASİK · 3 CAN','CLASSIC · 3 LIVES')}</button><button class="full" data-mode="1">◴ ${tr('ZAMANA KARŞI · 60 SN','TIME ATTACK · 60 SEC')}</button><button class="full" data-mode="2">ϟ ${tr('HAYATTA KAL · 1 CAN','SURVIVAL · 1 LIFE')}</button><button class="full" id="dailyReward">${tr('Günlük ödül','Daily reward')} · 50 ◉</button>`);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(+b.dataset.mode));$('dailyReward').disabled=s.day===day();$('dailyReward').onclick=()=>{if(s.day!==day()){s.day=day();s.coins+=50;save();menu()}}}function start(m){daily();mode=m;score=combo=0;level=1;lives=m===2?1:3;time=60;slow=0;shield=false;particles=[];spawn();state='play';$('overlay').hidden=true;hud();notify('')}function finish(){state='end';s.games++;s.daily.games++;save();hud();overlay(`<h2>${tr('OYUN BİTTİ','GAME OVER')}</h2><h1>${score}</h1><p>${tr('Rekor','Best')}: ${s.records[mode]}</p><button class="full primary" id="retry">${tr('Tekrar oyna','Play again')}</button><button class="full" id="back">${tr('Ana menü','Main menu')}</button>`);$('retry').onclick=()=>start(mode);$('back').onclick=menu}function resolve(){if(state!=='play')return;let ok=lane===kind;for(let i=0;i<22;i++)particles.push({x:(lane+.5)/4,y:.87,vx:(Math.random()-.5)*.7,vy:-Math.random()*.6,t:.65,c:ok?palettes[s.skin][kind]:'#ff496c'});sound(ok);if(ok){combo++;score+=10+Math.min(40,combo*2);s.coins+=1+(combo%5===0?3:0);s.total++;s.daily.matches++;s.maxCombo=Math.max(s.maxCombo,combo);s.daily.combo=Math.max(s.daily.combo,combo);level=1+Math.floor(score/200);s.maxLevel=Math.max(s.maxLevel,level);s.records[mode]=Math.max(s.records[mode],score)}else{combo=0;if(shield)shield=false;else if(mode===1)time=Math.max(0,time-3);else lives--}save();if(lives<=0||time<=0){finish();return}spawn();hud()}function power(i,c){if(state!=='play'||s.coins<c)return;s.coins-=c;if(i===0)slow=8;if(i===1)shield=true;if(i===2){lane=kind;resolve()}save();hud();notify([tr('8 saniye yavaş','Slow for 8 seconds'),tr('Kalkan aktif','Shield active'),tr('Otomatik eşleşme','Auto match')][i])}function pause(){if(state==='play'){state='pause';hud();overlay(`<h2>${tr('DURAKLATILDI','PAUSED')}</h2><button class="full primary" id="resume">${tr('Devam et','Resume')}</button><button class="full" id="quit">${tr('Ana menü','Main menu')}</button>`);$('resume').onclick=()=>{state='play';$('overlay').hidden=true;hud()};$('quit').onclick=menu}else if(state==='pause')$('resume').click()}$('pause').onclick=pause;$('home').onclick=menu;function move(d){if(state==='play')lane=Math.max(0,Math.min(3,lane+d))}$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('drop').onclick=()=>{if(state==='play')resolve()};let touch=null;cv.addEventListener('pointerdown',e=>{if(state!=='play'||s.control==='buttons')return;touch={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!touch)return;if(Math.abs(e.clientX-touch.x)>24){move(Math.sign(e.clientX-touch.x));touch.x=e.clientX}if(e.clientY-touch.y>45){resolve();touch=null}});cv.addEventListener('pointerup',e=>{if(touch&&Math.abs(e.clientY-touch.y)<12){let r=cv.getBoundingClientRect();lane=Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)))}touch=null});cv.addEventListener('pointercancel',()=>touch=null);document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(state==='play')resolve()}if(e.key==='Escape')pause()});function shape(k,x,y,r,c){ctx.save();ctx.translate(x,y);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=15;ctx.beginPath();if(k===0)ctx.rect(-r,-r,r*2,r*2);if(k===1)ctx.arc(0,0,r,0,Math.PI*2);if(k===2){ctx.moveTo(0,-r*1.2);ctx.lineTo(r,r);ctx.lineTo(-r,r);ctx.closePath()}if(k===3){ctx.moveTo(0,-r*1.3);ctx.lineTo(r*1.3,0);ctx.lineTo(0,r*1.3);ctx.lineTo(-r*1.3,0);ctx.closePath()}ctx.fill();ctx.restore()}function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;let w=cv.clientWidth,h=cv.clientHeight,d=Math.min(2,devicePixelRatio||1);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#10172b';ctx.fillRect(0,0,w,h);for(let i=0;i<45;i++){ctx.fillStyle='rgba(120,170,255,.18)';ctx.fillRect((i*79)%w,(i*43+t*.025)%h,2,2)}for(let i=1;i<4;i++){ctx.fillStyle='#34405b';ctx.fillRect(i*w/4,0,1,h)}if(state==='play'){if(mode===1)time-=dt;slow=Math.max(0,slow-dt);y+=dt*(.28+level*.035+(mode===2?.16:0))*(slow>0?.45:1);if(time<=0)finish();else if(y>=.86)resolve();if(mode===1)$('life').textContent=Math.ceil(time)+' s'}let colors=palettes[s.skin];for(let i=0;i<4;i++){ctx.fillStyle=colors[i]+'22';ctx.fillRect(i*w/4+3,h*.89,w/4-6,h*.11);shape(i,(i+.5)*w/4,h*.945,Math.min(13,w/18),colors[i])}if(state==='play'||state==='pause'){shape(kind,(lane+.5)*w/4,Math.max(20,y*h),Math.min(18,w/14),colors[kind]);if(shield){ctx.strokeStyle='#75eaff';ctx.beginPath();ctx.arc((lane+.5)*w/4,Math.max(20,y*h),26,0,Math.PI*2);ctx.stroke()}}for(let p of particles){if(state==='play'){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=dt}ctx.globalAlpha=Math.max(0,p.t/.65);ctx.fillStyle=p.c;ctx.fillRect(p.x*w,p.y*h,4,4)}ctx.globalAlpha=1;particles=particles.filter(p=>p.t>0);requestAnimationFrame(frame)}
function modal(title,html){if(state==='play')pause();$('content').innerHTML='<h2>'+title+'</h2>'+html;if(!$('dialog').open)$('dialog').showModal()}$('close').onclick=()=>$('dialog').close();$('settings').onclick=()=>{modal(tr('Ayarlar','Settings'),`<label>${tr('Dil','Language')} <select id="lang"><option value="tr">Türkçe</option><option value="en">English</option></select></label><label>${tr('Kontrol','Controls')} <select id="ctrl"><option value="both">${tr('Her ikisi','Both')}</option><option value="touch">${tr('Dokunmatik','Touch')}</option><option value="buttons">${tr('Tuşlar','Buttons')}</option></select></label><label><input type="checkbox" id="snd"> ${tr('Ses','Sound')}</label><small>V6.1 · ${store?tr('Yerel kayıt','Local save'):tr('Kayıt kullanılamıyor','Storage unavailable')}</small>`);$('lang').value=s.lang;$('ctrl').value=s.control;$('snd').checked=s.sound;$('lang').onchange=e=>{s.lang=e.target.value;save();if(state==='menu')menu();else hud();$('settings').click()};$('ctrl').onchange=e=>{s.control=e.target.value;save();hud()};$('snd').onchange=e=>{s.sound=e.target.checked;save()}};$('shop').onclick=()=>{modal(tr('Mağaza','Shop'),names.map((n,i)=>`<div class="item"><span style="color:${palettes[i][0]}">◆ ${n}</span><button data-skin="${i}" ${s.skin===i?'disabled':''}>${s.skin===i?tr('Seçili','Selected'):s.owned.includes(i)?tr('Seç','Equip'):i*100+' ◉'}</button></div>`).join(''));document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let i=+b.dataset.skin;if(!s.owned.includes(i)){if(s.coins<i*100){notify(tr('Yetersiz altın','Not enough coins'));return}s.coins-=i*100;s.owned.push(i)}s.skin=i;save();hud();$('shop').click()})};$('missions').onclick=()=>{daily();let tasks=[[tr('30 doğru eşleşme','30 matches'),s.daily.matches,30,40],[tr('3 oyun oyna','Play 3 games'),s.daily.games,3,30],[tr('10 kombo yap','Reach 10 combo'),s.daily.combo,10,50]];modal(tr('Günlük görevler','Daily missions'),tasks.map(([n,v,t,r],i)=>`<div class="item"><span>${n}<br><small>${Math.min(v,t)}/${t}</small></span><button data-task="${i}" ${v<t||s.daily.claimed.includes(i)?'disabled':''}>${s.daily.claimed.includes(i)?'✓':r+' ◉'}</button></div>`).join(''));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let i=+b.dataset.task;if(!s.daily.claimed.includes(i)&&tasks[i][1]>=tasks[i][2]){s.daily.claimed.push(i);s.coins+=tasks[i][3];save();hud();$('missions').click()}})};$('badges').onclick=()=>{let a=[[tr('İlk oyun','First game'),s.games>=1],[tr('100 eşleşme','100 matches'),s.total>=100],[tr('10 kombo','10 combo'),s.maxCombo>=10],[tr('Seviye 5','Level 5'),s.maxLevel>=5],[tr('500 puan','500 points'),Math.max(...s.records)>=500],[tr('Koleksiyoncu','Collector'),s.owned.length===5]];modal(tr('Başarı rozetleri','Achievements'),a.map(([n,v])=>`<div class="item"><span>${v?'🏆':'🔒'} ${n}</span></div>`).join(''))};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});menu();requestAnimationFrame(frame);
